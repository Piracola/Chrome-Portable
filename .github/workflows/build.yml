name: Chrome Portable Build

on:
  workflow_dispatch:
    inputs:
      builder_ref:
        description: ChromiumPortable engine release tag.
        required: false
        default: v2
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    permissions:
      contents: write
    uses: Piracola/ChromiumPortable/.github/workflows/portable-browser.yml@main
    with:
      builder-repository: Piracola/ChromiumPortable
      builder-ref: ${{ github.event.inputs.builder_ref || 'v2' }}
      config: browser.json
      targets: chrome_stable,chrome_beta,chrome_stable_arm64,chrome_beta_arm64
      artifact-name: Chrome-Portable-Builds
      pre-check-command: node scripts/test-config.cjs
      artifact-retention-days: 15
